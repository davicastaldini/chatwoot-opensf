name: Deploy OPENSF VPS

on:
  push:
    branches:
      - opensf
  workflow_dispatch:

concurrency:
  group: opensf-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OPENSF_VPS_HOST }}
          username: ${{ secrets.OPENSF_VPS_USER }}
          key: ${{ secrets.OPENSF_VPS_SSH_KEY }}
          port: ${{ secrets.OPENSF_VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /data/dev/chatwoot-opensf

            git fetch origin opensf
            git checkout opensf
            git reset --hard origin/opensf

            docker compose restart rails sidekiq vite
            docker compose ps

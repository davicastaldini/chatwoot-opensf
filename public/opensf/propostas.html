<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Propostas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    background: #f8fafc;
    color: #1e293b;
    padding: 12px;
  }

  #state-empty, #state-no-cpf, #state-loading, #state-error {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    text-align: center;
    color: #64748b;
    gap: 8px;
  }

  #state-empty svg, #state-no-cpf svg, #state-loading svg, #state-error svg {
    width: 36px; height: 36px; opacity: 0.4;
  }

  #state-loading svg { animation: spin 1s linear infinite; opacity: 0.6; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .header h2 {
    font-size: 13px;
    font-weight: 600;
    color: #004880;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .count-badge {
    background: #004880;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
  }

  .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    transition: box-shadow 0.15s;
  }

  .card:hover { box-shadow: 0 2px 8px rgba(0,72,128,0.1); }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .banco {
    font-weight: 600;
    font-size: 12px;
    color: #0f172a;
    line-height: 1.3;
  }

  .produto {
    font-size: 11px;
    color: #64748b;
    margin-top: 2px;
    line-height: 1.3;
  }

  .status-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
    background: #e2e8f0;
    color: #475569;
  }

  .divider {
    border: none;
    border-top: 1px solid #f1f5f9;
    margin: 8px 0;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
  }

  .info-item label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #94a3b8;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .info-item span {
    font-size: 12px;
    color: #334155;
    font-weight: 500;
  }

  .valor { color: #004880 !important; font-weight: 700 !important; font-size: 13px !important; }

  .convenio-row {
    margin-top: 6px;
    font-size: 11px;
    color: #64748b;
  }

  .convenio-row strong { color: #334155; }
</style>
</head>
<body>

<div id="state-no-cpf" style="display:flex">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
  </svg>
  <span>CPF não informado no contato</span>
</div>

<div id="state-loading">
  <svg viewBox="0 0 24 24" fill="none" stroke="#004880" stroke-width="2">
    <path stroke-linecap="round" d="M12 3v3M12 18v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M3 12h3M18 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
  </svg>
  <span>Consultando propostas...</span>
</div>

<div id="state-error">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
  </svg>
  <span id="error-msg">Erro ao consultar propostas</span>
</div>

<div id="state-empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
  </svg>
  <span>Nenhuma proposta encontrada</span>
</div>

<div id="proposals-container"></div>

<script>
  const fmt = {
    currency: v => v == null ? '—' : 'R$ ' + parseFloat(v).toLocaleString('pt-BR', { minimumFractionDigits: 2 }),
    date: v => {
      if (!v) return '—';
      const d = new Date(v);
      return isNaN(d) ? '—' : d.toLocaleDateString('pt-BR');
    }
  };

  function show(id) {
    ['state-no-cpf','state-loading','state-error','state-empty','proposals-container']
      .forEach(s => document.getElementById(s).style.display = s === id ? 'flex' : 'none');
    if (id === 'proposals-container') document.getElementById(id).style.display = 'block';
  }

  function statusStyle(cor, desc) {
    const map = {
      green: '#dcfce7;color:#15803d',
      red: '#fee2e2;color:#b91c1c',
      yellow: '#fef9c3;color:#a16207',
      blue: '#dbeafe;color:#1d4ed8',
      gray: '#f1f5f9;color:#475569',
    };
    const key = (cor || '').toLowerCase();
    const style = map[key] || map.gray;
    return `background:${style.split(';')[0].replace('background:','')};${style.split(';')[1] || ''}`;
  }

  function renderCard(p) {
    const status = p.desc_status_proposta || p.status_banco || '—';
    const cor = p.cor_status_banco || '';
    return `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="banco">${p.banco || '—'}</div>
            <div class="produto">${p.produto || '—'}</div>
          </div>
          <span class="status-badge" style="${statusStyle(cor, status)}">${status}</span>
        </div>
        <hr class="divider"/>
        <div class="info-grid">
          <div class="info-item">
            <label>Valor Líquido</label>
            <span class="valor">${fmt.currency(p.valor_liquido)}</span>
          </div>
          <div class="info-item">
            <label>Data Proposta</label>
            <span>${fmt.date(p.data_proposta)}</span>
          </div>
          <div class="info-item">
            <label>Averbação</label>
            <span>${fmt.date(p.data_averbacao)}</span>
          </div>
          <div class="info-item">
            <label>Pagamento</label>
            <span>${fmt.date(p.data_pagamento_banco)}</span>
          </div>
        </div>
        ${p.convenio ? `<div class="convenio-row">Convênio: <strong>${p.convenio}</strong></div>` : ''}
        ${p.operacao ? `<div class="convenio-row">Operação: <strong>${p.operacao}</strong></div>` : ''}
      </div>`;
  }

  function getAuthHeaders() {
    try {
      const keys = ['access-token', 'token-type', 'client', 'uid'];
      const headers = {};
      keys.forEach(k => { const v = localStorage.getItem(k); if (v) headers[k] = v; });
      return headers;
    } catch { return {}; }
  }

  async function loadProposals(cpf, accountId) {
    show('state-loading');
    try {
      const clean = cpf.replace(/\D/g, '');
      const res = await fetch(`/api/v1/accounts/${accountId}/opensf/proposals?cpf=${clean}`, {
        headers: { 'Content-Type': 'application/json', ...getAuthHeaders() }
      });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();

      if (!data.length) { show('state-empty'); return; }

      const container = document.getElementById('proposals-container');
      container.innerHTML = `
        <div class="header">
          <h2>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#004880" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
            </svg>
            Propostas
          </h2>
          <span class="count-badge">${data.length}</span>
        </div>
        ${data.map(renderCard).join('')}`;
      show('proposals-container');
    } catch (e) {
      document.getElementById('error-msg').textContent = 'Erro ao consultar propostas (' + e.message + ')';
      show('state-error');
    }
  }

  window.addEventListener('message', e => {
    const { event, data } = e.data || {};
    if (event !== 'appContext' || !data) return;

    const contact = data.contact || {};
    const cpf = (contact.custom_attributes || {}).cpf || (contact.additional_attributes || {}).cpf || '';
    const accountId = (data.conversation || {}).account_id || '';

    if (!cpf || !accountId) { show('state-no-cpf'); return; }
    loadProposals(cpf, accountId);
  });

  show('state-no-cpf');
</script>
</body>
</html>
